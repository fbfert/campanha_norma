<VirtualHost *:80>
    ServerName mensagens.exemplo.com
    DocumentRoot /var/www/gerenciador-mensagens/public

    <Directory /var/www/gerenciador-mensagens/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/gerenciador-mensagens-error.log
    CustomLog ${APACHE_LOG_DIR}/gerenciador-mensagens-access.log combined
</VirtualHost>
